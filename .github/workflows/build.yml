name: build-and-push
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pytest pytest-asyncio PyYAML "runpod==1.7.10" "numpy==1.26.4"
      - run: PYTHONPATH=backend:. pytest ruh_model/tests/ tests/ -q

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify checkpoint
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo '::error::KAGGLE_API_TOKEN is required in this repository Actions secrets for the checkpoint download.'
            exit 1
          fi
          python scripts/fetch_checkpoint.py

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A dedicated BuildKit builder exports directly to GHCR rather than
      # relying on the runner Docker image store for the large CUDA layer.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: RUH_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/codewithjuber/ruh-serverless:${{ github.sha }}
            ghcr.io/codewithjuber/ruh-serverless:latest

  deploy:
    name: Deploy RunPod
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that this is still the latest main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "deploy=$([ "$current" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy immutable image and verify the worker revision
        if: steps.current.outputs.deploy == 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.RUNPOD_API_TOKEN }}
          RUNPOD_ENDPOINT_ID: ${{ vars.RUNPOD_ENDPOINT_ID || '6o38qhvti4knkk' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: python scripts/deploy_runpod.py
